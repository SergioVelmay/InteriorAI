# Documentación pública de InteriorAI (GitHub Pages, Paso 34).
#   uv run --group docs mkdocs serve           # en local: http://127.0.0.1:8000
#   uv run --group docs mkdocs build --strict  # lo que comprueba la CI
# Se publica con .github/workflows/docs.yml al mergear en `main`.

site_name: InteriorAI
site_description: >-
  Estudio de interiorismo asistido por IA con supervisión humana en cada etapa: referencias,
  bocetos, composición y render final, con Azure AI Foundry.
site_author: Sergio Velasco
site_url: https://sergiovelmay.github.io/InteriorAI/
repo_url: https://github.com/SergioVelmay/InteriorAI
repo_name: SergioVelmay/InteriorAI
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sergio Velasco · Licencia MIT

docs_dir: docs
# El contexto para agentes de IA y la bitácora de pasos se consultan en el repositorio.
exclude_docs: |
  agent/
  pasos/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es
  - glightbox:
      zoomable: true
      draggable: false
  # Swagger de la referencia de la API, solo de consulta (sin «Try it out»: no hay backend)
  - swagger-ui-tag:
      docExpansion: none
      filter: true
      supportedSubmitMethods: []
      syntaxHighlightTheme: monokai

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergioVelmay/InteriorAI
      name: Repositorio en GitHub

nav:
  - Inicio: index.md
  - Primeros pasos:
      - primeros-pasos/index.md
      - Instalación: primeros-pasos/instalacion.md
      - Configuración: primeros-pasos/configuracion.md
  - Manual de usuario:
      - manual/index.md
      - 1. Proyectos: manual/proyectos.md
      - 2. Referencias: manual/referencias.md
      - 3. Bocetos: manual/bocetos.md
      - 4. Composición: manual/composicion.md
      - 5. Render final: manual/render-final.md
      - 6. Costes IA: manual/costes.md
      - Consejos: manual/consejos.md
  - Referencia técnica:
      - referencia/index.md
      - Arquitectura: referencia/arquitectura.md
      - API REST: referencia/api.md
      - Datos y almacenamiento: referencia/datos.md
      - IA y costes: referencia/ia-y-costes.md
      - Interfaz: referencia/interfaz.md
  - Desarrollo:
      - desarrollo/index.md
      - Pruebas y CI: desarrollo/pruebas.md
      - Operación y herramientas: desarrollo/operacion.md
  - Proyecto:
      - proyecto/index.md
      - Versiones: proyecto/versiones.md
      - Seguridad: proyecto/seguridad.md
      - Licencia: proyecto/licencia.md
