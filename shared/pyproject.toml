[project]
name = "interiorai-shared"
version = "4.0.0"
description = "Configuración, roles y modelos comunes de InteriorAI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
