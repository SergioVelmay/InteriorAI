[project]
name = "interiorai"
version = "0.1.0"
description = "Estudio de interiorismo asistido por IA con Human-in-the-Loop"
requires-python = ">=3.11,<3.12"
dependencies = ["interiorai-shared", "interiorai-backend", "interiorai-frontend"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "backend", "frontend"]

[tool.uv.sources]
interiorai-shared = { workspace = true }
interiorai-backend = { workspace = true }
interiorai-frontend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["shared/tests", "backend/tests", "frontend/tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Igual que en producción (app/api/uploads.py): la advertencia de Pillow es un error.
filterwarnings = ["error::PIL.Image.DecompressionBombWarning"]
