[project]
name = "interiorai"
version = "2.0.0"
description = "Estudio de interiorismo asistido por IA con Human-in-the-Loop"
requires-python = ">=3.11,<3.12"
dependencies = ["interiorai-shared", "interiorai-backend", "interiorai-frontend"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# Pruebas de extremo a extremo (e2e/): uv run --group e2e pytest e2e
e2e = [
    "playwright>=1.48",
    "pytest-playwright>=0.6",
]

[tool.uv]
package = false
# Seguridad: Gradio 6.30 exige pillow<13, pero las alertas de Pillow (críticas incluidas) solo
# se corrigen en 13.0.0. Se fuerza 13 mientras Gradio no lo permita (quitar entonces).
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.workspace]
members = ["shared", "backend", "frontend"]

[tool.uv.sources]
interiorai-shared = { workspace = true }
interiorai-backend = { workspace = true }
interiorai-frontend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["shared/tests", "backend/tests", "frontend/tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Igual que en producción (app/api/uploads.py): la advertencia de Pillow es un error.
filterwarnings = ["error::PIL.Image.DecompressionBombWarning"]
