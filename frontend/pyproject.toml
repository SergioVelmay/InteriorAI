[project]
name = "interiorai-frontend"
version = "2.0.0"
description = "Interfaz Gradio de InteriorAI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "interiorai-shared",
    "gradio>=6.0",
    "httpx>=0.27",
    "pandas>=2.0",  # tablas de los gráficos y del registro de costes
    "altair>=5.5",  # gráficos de Costes IA con leyenda y etiquetas legibles (B-032)
]

[tool.uv.sources]
interiorai-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui"]
