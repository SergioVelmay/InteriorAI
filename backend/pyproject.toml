[project]
name = "interiorai-backend"
version = "3.0.0"
description = "API FastAPI de InteriorAI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "interiorai-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anyio>=4.4",
    "filelock>=3.16",
    "pillow>=13.0",  # alertas de seguridad corregidas en 13.0.0
    "python-multipart>=0.0.12",
    "openai>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.uv.sources]
interiorai-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
